
[project]
name = "moroccan-markets-ia-analyst"
version = "0.1.0"
description = "AI-powered analysis of Moroccan financial markets"
readme = "README.md"
authors = [
    { name = "Safia Tirar", email = "safiatirar6@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.140.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=1.26.4,<2",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf<2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "transformers<5",
]

[project.scripts]
moroccan-markets-ia-analyst = "moroccan_markets_ai.main:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "moroccan_markets_ai"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
