
[project]
name = "moroccan-markets-ia-analyst"
version = "0.1.0"
description = "AI-powered analysis of Moroccan financial markets"
readme = "README.md"
authors = [
    { name = "Safia Tirar", email = "safiatirar6@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
moroccan-markets-ia-analyst = "moroccan_markets_ai.main:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "moroccan_markets_ai"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
